  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }
  function render(){
    var d=0;
    cards.forEach(function(c){ var on=!!st[c.dataset.code]; c.setAttribute('aria-pressed', on); if(on) d++;
      c.classList.toggle('hide', !(f==='ALL' || f===c.dataset.kind || (f==='TODO' && !on))); });
    document.getElementById('tot').innerHTML=d+'/'+cards.length+' <small>DONE</small>';
    document.getElementById('bar').style.width=(100*d/cards.length)+'%';
    [].forEach.call(document.querySelectorAll('.strip'), function(s){ var cs=s.querySelectorAll('.card'), n=0; [].forEach.call(cs,function(c){ if(st[c.dataset.code]) n++; });
      document.querySelector('.cnt[data-g="'+s.dataset.g+'"]').textContent=n+'/'+cs.length; s.parentNode.style.display = [].some.call(cs,function(c){return !c.classList.contains('hide');}) ? '' : 'none'; });
  }
  cards.forEach(function(c){ c.addEventListener('click', function(){ var k=c.dataset.code; if(st[k]) delete st[k]; else st[k]=1; save(); render(); }); });
  [].forEach.call(document.querySelectorAll('[data-f]'), function(b){ b.addEventListener('click', function(){ f=b.dataset.f; [].forEach.call(document.querySelectorAll('[data-f]'),function(x){x.classList.toggle('on',x===b);}); render(); }); });
  document.getElementById('reset').addEventListener('click', function(){ if(confirm('Reset all? Every shot goes back to TO DO.')){ st={}; save(); render(); } });
  render();
})();
</script></body></html>
